
<style>
#erd { padding: 0; }
#erd svg { width: 100%; height: auto; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#AFA9EC' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#5DCAA5' : '#0F6E56',
    secondaryTextColor: dark ? '#9FE1CB' : '#04342C',
    tertiaryColor: dark ? '#712B13' : '#FAECE7',
    tertiaryBorderColor: dark ? '#F0997B' : '#993C1D',
    tertiaryTextColor: dark ? '#F5C4B3' : '#4A1B0C',
  },
});
const diagram = `erDiagram
  USERS {
    int id PK
    string name
    string email
    string password_hash
    string role
    timestamp created_at
  }
  CUSTOMERS {
    int id PK
    int user_id FK
    string address
    string phone
  }
  PRODUCTS {
    int id PK
    int category_id FK
    string name
    float price
    int stock_qty
    text description
  }
  CATEGORIES {
    int id PK
    string name
    int parent_id FK
  }
  ORDERS {
    int id PK
    int customer_id FK
    int payment_id FK
    string status
    timestamp ordered_at
    float total_amount
  }
  ORDER_ITEMS {
    int id PK
    int order_id FK
    int product_id FK
    int quantity
    float unit_price
  }
  PAYMENTS {
    int id PK
    float amount
    string method
    string status
    timestamp paid_at
  }
  REVIEWS {
    int id PK
    int customer_id FK
    int product_id FK
    int rating
    text comment
    timestamp created_at
  }

  USERS ||--o| CUSTOMERS : "has"
  CUSTOMERS ||--o{ ORDERS : "places"
  ORDERS ||--|{ ORDER_ITEMS : "contains"
  ORDER_ITEMS }o--|| PRODUCTS : "refers to"
  PRODUCTS }o--|| CATEGORIES : "belongs to"
  CATEGORIES ||--o{ CATEGORIES : "parent of"
  ORDERS ||--o| PAYMENTS : "paid via"
  CUSTOMERS ||--o{ REVIEWS : "writes"
  PRODUCTS ||--o{ REVIEWS : "receives"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
