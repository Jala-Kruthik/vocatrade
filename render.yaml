services:
  - type: web
    name: vocatrade-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: vocatrade_super_secret_jwt_key_2024
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://vocatrade-ba09e.web.app
      - key: MONGODB_URI
        sync: false
